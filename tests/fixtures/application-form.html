<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Example Tech</title>
  </head>
  <body>
    <h1>Review your application</h1>
    <form>
      <label>Full name <input name="name" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Phone <input name="phone" /></label>
      <label>Location <input name="location" /></label>
      <label>LinkedIn <input name="linkedin" /></label>
      <label>Resume <input name="resume" type="file" /></label>
      <button type="button" id="submit">Submit Application</button>
    </form>
    <script>
      document.getElementById("submit").addEventListener("click", () => {
        document.body.dataset.submitted = "true";
      });
    </script>
  </body>
</html>
